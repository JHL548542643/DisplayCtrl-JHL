<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>DisplayCtl 控制台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='4' width='16' height='11' rx='2' fill='%23d6f25c'/%3E%3Crect x='12' y='15' width='17' height='12' rx='2' fill='none' stroke='%23edf2e6' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      try {
        var theme = localStorage.getItem("displayctl.theme");
        if (theme === "graphite" || theme === "day" || theme === "night") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
