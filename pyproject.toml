[project]
name = "displayctl-jhl"
version = "0.3.1"
description = "Windows external-monitor control for luminance, contrast, and volume, with a native window and tray"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
pack = [
  "pyinstaller>=6.0",
  "pywebview>=5.0",
  "pystray>=0.19",
  "pillow>=10.0",
]

[project.scripts]
displayctl = "displayctl.cli:main"
displayctl-app = "displayctl.app_main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["displayctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
